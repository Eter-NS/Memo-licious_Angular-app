@if (data$ | async; as data) {
<div
  data-test="bottom-sheet-overlay"
  class="overlay"
  [ngClass]="{
    'do-not-animate': data.noAnimation,
    visible: data.isOpened
  }"
  [ariaHidden]="!data.isOpened"
  (click)="close()"
  (keyup.enter)="close()"
  tabindex="0"
></div>

<div
  #sheet
  data-test="bottom-sheet-element"
  class="bottom-sheet"
  role="dialog"
  aria-modal="true"
  [ngClass]="{
    'do-not-animate': data.noAnimation,
    open: data.isOpened,
    drag: data.isDragging
  }"
  [ariaHidden]="!data.isOpened"
>
  <div
    data-test="drag-icon"
    class="drag-icon"
    (pointerdown)="startDragging($event)"
  >
    <span></span>
  </div>

  <div class="content">
    @if (data.isOpened) {
    <ng-container *ngTemplateOutlet="content || defaultContent"></ng-container>
    }
  </div>

  <ng-template #defaultContent>
    <h2 data-test="default-content">There is nothing to be shown 😢</h2>
  </ng-template>
</div>
}
