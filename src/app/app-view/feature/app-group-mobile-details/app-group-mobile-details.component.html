<main>
  <section
    #viewContainer
    aria-label="you can edit your notes here"
    class="note-edit"
  >
    @if (data$ | async; as data){

    <div class="form-wrapper">
      <app-note-list-form
        #form
        data-test="editing-form"
        environment="note-edit"
        [noteListTitle]="data.noteGroupTitle"
        [notes]="data.groupNotes"
        (createNote)="onCreateNote($event)"
        (editNote)="onEditNote($event)"
        (removeNote)="onRemoveNote($event)"
      />
    </div>

    <div class="note-edit__actions">
      <button
        type="button"
        data-test="note-edit-action-button-cancel"
        class="note-edit__action-button"
        (click)="closeEditor('close')"
        appAdaptiveButton
        look="extended-fab"
        color="primary-less"
      >
        <mat-icon>cancel</mat-icon> Close
      </button>

      <button
        type="button"
        data-test="note-edit-action-button-save"
        class="note-edit__action-button"
        (click)="closeEditor('save')"
        appAdaptiveButton
        look="extended-fab"
        color="primary"
      >
        <mat-icon>save</mat-icon> Save
      </button>
    </div>

    } @else {

    <app-fetch-error
      data-test="fetch-error-data$-no-emit"
      (clicked)="viewTransitionService.pageReload()"
    >
      Unable to download note data.
    </app-fetch-error>

    }
  </section>
</main>
